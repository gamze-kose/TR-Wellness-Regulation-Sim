h tourism\",\n \"ozet\": \"Article 17 of the regulation has not determined the procedures for wellness services within health tourism. This tool measures the effect of that gap on centres and visitors.\",\n \"a1\": \"Data and model\",\n \"a2\": \"Centres\",\n \"a3\": \"Visitors\",\n \"a4\": \"Results\",\n \"ileri\": \"Next\",\n \"geri\": \"Back\",\n \"s1_b\": \"Record set and model training\",\n \"s1_n\": \"The structure of the network comes from the planning criteria of Article 10(1). The probability tables are not written by hand; they are learned from the records below. Adding a record retrains the model.\",\n \"veri_b\": \"Records\",\n \"veri_adet\": \"records\",\n \"veri_ornek\": \"The starter set is not real intake data; it was constructed from domain rules and is expected to be replaced with real records.\",\n \"veri_ekle\": \"Add record\",\n \"veri_sil\": \"Delete last record\",\n \"veri_sifirla\": \"Restore starter set\",\n \"veri_bosalt\": \"Delete all\",\n \"veri_yok\": \"No records. The model cannot be trained.\",\n \"dagilim_b\": \"Variable distributions\",\n \"model_b\": \"Learned tables\",\n \"model_n\": \"Select a node. The columns show the learned probabilities and the last figure how many observations the row rests on.\",\n \"model_dugum\": \"Node\",\n \"model_satir\": \"rows\",\n \"model_zayif\": \"rows resting on fewer than five observations\",\n \"gozlem\": \"observations\",\n \"kpt_kosul\": \"Parent combination\",\n \"ebeveyn_yok\": \"No parent nodes\",\n \"ornek_b\": \"Draw a profile from the model\",\n \"ornek_dugme\": \"Draw a profile\",\n \"ornek_n\": \"The network is traversed in topological order; at each node a draw is made from the row matching the parent values.\",\n \"s2_b\": \"Building the wellness centres\",\n \"s2_n\": \"Applications first pass the structural rules; those failing area, room, permit or responsible-manager conditions receive no licence. Licensed centres are then assessed against the Annex 4 inspection rules.\",\n \"m_adet\": \"How many centres?\",\n \"m_yapisal\": \"Share of applications meeting the licence conditions\",\n \"m_denetim\": \"Share of centres complying with the inspection rules\",\n \"m_uret\": \"Build the centres\",\n \"m_kabul\": \"licensed\",\n \"m_red\": \"applications refused\",\n \"m_red_b\": \"Grounds for refusal\",\n \"m_ihlalli\": \"centres with an inspection violation\",\n \"m_kapasite\": \"Capacity\",\n \"m_hizmet\": \"Services\",\n \"m_ihlal\": \"Violations\",\n \"m_ihlal_yok\": \"No violations\",\n \"s3_b\": \"Generating synthetic visitors and applying them to the centres\",\n \"s3_n\": \"Visitors are drawn from the trained model, then matched against the centres one by one. A person in convalescence is ineligible under Article 10(8)(d). For those resident abroad, Article 17 comes into play.\",\n \"z_adet\": \"How many visitors?\",\n \"z_senaryo\": \"Regulatory scenario\",\n \"z_istah\": \"Share of centres accepting visitors from abroad while undefined\",\n \"z_uret\": \"Generate and match\",\n \"z_bekleniyor\": \"Build the centres first.\",\n \"s4_b\": \"Results\",\n \"s4_n\": \"A three-valued outcome for each visitor. Undefined means no rule is violated but the status remains undetermined because Article 17 has set no procedures.\",\n \"r_uygun\": \"Served\",\n \"r_belirsiz\": \"Undefined\",\n \"r_degil\": \"Not served\",\n \"r_neden_b\": \"Provisions determining the outcome\",\n \"r_neden_hizmet\": \"Service provided\",\n \"r_kirilim_b\": \"Segment breakdown\",\n \"r_ikamet\": \"By residence\",\n \"r_yas\": \"By age group\",\n \"r_arketip\": \"By service sought\",\n \"r_doluluk\": \"Average occupancy of the centres\",\n \"proj_b\": \"Multi-year projection\",\n \"proj_n\": \"Ten-year course of the five scenarios. The solid line is the median, the shaded area the 10–90 percentile range across repetitions.\",\n \"proj_ufuk\": \"Horizon\",\n \"proj_5\": \"5 years\",\n \"proj_10\": \"10 years\",\n \"g_uyum\": \"Centres in good or fair compliance\",\n \"g_tanimsiz\": \"Demand left undefined\",\n \"g_ucuncu\": \"Violations reaching a third detection\",\n \"g_aktif\": \"Number of open centres\",\n \"g_doluluk\": \"Average occupancy\",\n \"g_kapanan\": \"Centres closing that year\",\n \"g_yurtdisi\": \"Share of visitors from abroad served\",\n \"g_aldi\": \"Share of visitors served\",\n \"g_alamadi\": \"Share of visitors not served\",\n \"d_yas_grubu\": \"Age group\",\n \"d_ikamet\": \"Residence\",\n \"d_yasam_tarzi\": \"Lifestyle\",\n \"d_kronik_yuk\": \"General health\",\n \"d_risk_faktoru\": \"Risk factors\",\n \"d_yakin_cerrahi\": \"Recent surgery\",\n \"d_nekahet\": \"Convalescence\",\n \"d_talep_arketipi\": \"Service sought\",\n \"yas_grubu_18_34\": \"18-34\",\n \"yas_grubu_35_49\": \"35-49\",\n \"yas_grubu_50_64\": \"50-64\",\n \"yas_grubu_65_ustu\": \"65 and over\",\n \"kronik_yuk_yok\": \"No chronic condition\",\n \"kronik_yuk_hafif\": \"Mild\",\n \"kronik_yuk_orta\": \"Moderate\",\n \"kronik_yuk_agir\": \"Severe\",\n \"risk_faktoru_dusuk\": \"Low\",\n \"risk_faktoru_orta\": \"Moderate\",\n \"risk_faktoru_yuksek\": \"High\",\n \"yasam_tarzi_hareketli\": \"Active\",\n \"yasam_tarzi_orta\": \"Moderate\",\n \"yasam_tarzi_hareketsiz\": \"Sedentary\",\n \"yakin_cerrahi_yok\": \"None\",\n \"yakin_cerrahi_var\": \"Yes\",\n \"nekahet_hayir\": \"No\",\n \"nekahet_evet\": \"Yes\",\n \"ikamet_yurt_ici\": \"Turkey\",\n \"ikamet_yurt_disi\": \"Abroad\",\n \"talep_arketipi_termal_balneoloji\": \"Thermal and balneology\",\n \"talep_arketipi_getat\": \"Traditional medicine\",\n \"talep_arketipi_egzersiz\": \"Exercise\",\n \"talep_arketipi_psikososyal\": \"Psychosocial\",\n \"talep_arketipi_uyku_beslenme\": \"Sleep and nutrition\",\n \"talep_arketipi_rehabilitasyon_destek\": \"Rehabilitation\",\n \"v_mustakil_bina\": \"Detached building\",\n \"v_konaklama_tesisi\": \"Accommodation facility\",\n \"v_yasli_bakim_merkezi\": \"Elderly care centre\",\n \"v_engelli_bakim_merkezi\": \"Disabled care centre\",\n \"v_spor_kulubu\": \"Sports club\",\n \"v_merkez\": \"Centre\",\n \"v_unite\": \"Unit\",\n \"u1_b\": \"This is not a forecast.\",\n \"u1\": \"There is no data to project a sector one month old across ten years. Entry rate, demand growth and compliance behaviour are assumptions. What matters is the difference between scenarios, not the absolute numbers.\",\n \"u2_b\": \"Data.\",\n \"u2\": \"All centres and visitors are synthetic. No real person or institution data is used.\",\n \"u3_b\": \"Rule source.\",\n \"u3\": \"Twenty-one inspection rules come from Annex 4 and twelve structural rules from the articles. The binding text is the Official Gazette.\",\n \"a5\": \"Uncertainty\",\n \"mal_b\": \"Compliance cost and viability\",\n \"mal_n\": \"The cost of the conditions imposed by the regulation varies by centre type. The figures are not real market data but relative units, scalable with the slider below. A centre whose revenue does not cover its cost cannot survive in the long run.\",\n \"mal_olcek\": \"Cost scale\",\n \"mal_doluluk\": \"Assumed occupancy\",\n \"mal_kalem\": \"Cost items\",\n \"mal_dayanak\": \"Basis\",\n \"mal_tutar\": \"Unit\",\n \"mal_grup\": \"Viability by centre type\",\n \"mal_ayakta\": \"viable\",\n \"mal_marj\": \"Average margin\",\n \"mal_adet\": \"centres\",\n \"mal_secili\": \"Cost breakdown of the selected centre\",\n \"mal_gelir\": \"Revenue\",\n \"mal_toplam\": \"Total cost\",\n \"sen_kutu\": \"Scenario detail\",\n \"sen_m17\": \"Status of Article 17\",\n \"sen_yururluk\": \"Year in force\",\n \"sen_kabul\": \"Acceptance after the regulation\",\n \"sen_denetim\": \"Annual inspection rate\",\n \"sen_unite\": \"Units within scope\",\n \"m17_yok\": \"No secondary regulation issued\",\n \"m17_izin_verici\": \"Permissive regulation\",\n \"m17_kisitlayici\": \"Restrictive regulation\",\n \"evet\": \"Yes\",\n \"hayir\": \"No\",\n \"yok\": \"—\",\n \"duy_b\": \"Sensitivity analysis\",\n \"duy_n\": \"Each parameter is moved to its lower and upper value in turn and the change in the outcome is measured. A long bar means that outcome depends heavily on that parameter. Making the influence of free parameters visible is more honest than hiding it.\",\n \"duy_calistir\": \"Compute sensitivity\",\n \"duy_hesap\": \"Computing…\",\n \"duy_par\": \"Parameter\",\n \"duy_aralik\": \"Range\",\n \"duy_uygun\": \"Share served\",\n \"duy_belirsiz\": \"Share undefined\",\n \"duy_doluluk\": \"Occupancy\",\n \"duy_red\": \"Licence refusal\",\n \"p_merkez_sayisi\": \"Number of centres\",\n \"p_ziyaretci\": \"Number of visitors\",\n \"p_yapisal_uyum\": \"Compliance with licence conditions\",\n \"p_denetim_uyumu\": \"Compliance with inspection rules\",\n \"p_belirsizlik_istahi\": \"Risk appetite while undefined\",\n \"bel_b\": \"Uncertainties in the regulation\",\n \"bel_n\": \"A catalogue produced by reading the text article by article. Each entry marks a gap that prevents a provision from being applied on its own. Article 17 is only one line of this catalogue.\",\n \"bel_tur\": \"Type\",\n \"bel_dayanak\": \"Basis\",\n \"bel_etki\": \"Area affected\",\n \"bel_agirlik\": \"Weight\",\n \"bel_toplam\": \"entries\",\n \"bel_turizm\": \"affecting health tourism\",\n \"bel_suz\": \"Filter by type\",\n \"bel_hepsi\": \"All\",\n \"g_kayitdisi\": \"Unlicensed operators active\",\n \"g_fiili\": \"Actual inspection rate\",\n \"anim_b\": \"Matching\",\n \"anim_islenen\": \"visitors processed\",\n \"r_neden_hizmet_yok\": \"No centre offers the service sought\",\n \"r_neden_kapasite_dolu\": \"Centres offering it are at capacity\",\n \"r_neden_10/8-d\": \"Wellness services may not be provided in convalescence (Article 10(8)(d))\",\n \"r_neden_17/1\": \"Procedures for health tourism are undetermined (Article 17)\"\n}", "cikti/onceden.json": "{\"anahtar\":20260704,\"tekrar\":8,\"kosular\":{\"S0_5\":{\"senaryo\":\"S0\",\"senaryo_adi\":\"Belirsizlik sürüyor\",\"yillar\":[2026,2027,2028,2029,2030],\"bantlar\":{\"mevzuat\":{\"uyum_orani\":{\"ortanca\":[0.883,0.907,0.92 ranting the licence but an obligation arising after it.\",\n   \"asama\": \"ruhsat_sonrasi\"\n  },\n  {\n   \"kod\": \"Y12\",\n   \"dayanak\": \"17/1\",\n   \"aciklama\": \"Sağlık turizmi kapsamında sunulacak esenlik hizmetlerine ilişkin usul ve esaslar Bakanlıkça belirlenir. İkincil düzenleme yayımlanmamıştır.\",\n   \"tur\": \"belirsiz\",\n   \"kosul_alan\": \"saglik_turizmi_kapsaminda\",\n   \"kosul_deger\": true,\n   \"sonuc\": \"belirsiz\",\n   \"aciklama_en\": \"Procedures and principles for wellness services provided within the scope of health tourism are to be determined by the Ministry. The secondary regulation has not been issued.\",\n   \"asama\": \"ruhsat\"\n  }\n ],\n \"ceviri_notu\": \"İngilizce metinler resmî olmayan çalışma çevirisidir.\"\n}", "mevzuat/hizmetler.json": "{\n \"kaynak\": \"Esenlik Hizmetleri Yönetmeliği Madde 4/1-c\",\n \"not\": \"Madde 4/1-c yirmi dört hizmet türünü sayıp “ile benzer nitelikteki hizmetleri” ifadesiyle listeyi açık bırakmaktadır. Açık uç bu dosyada modellenmemiştir.\",\n \"hizmetler\": [\n  {\n   \"kod\": \"H01\",\n   \"ad\": \"Balneoterapi\",\n   \"ad_en\": \"Balneotherapy\"\n  },\n  {\n   \"kod\": \"H02\",\n   \"ad\": \"Beslenme hizmetleri\",\n   \"ad_en\": \"Nutrition services\"\n  },\n  {\n   \"kod\": \"H03\",\n   \"ad\": \"Dil ve konuşma terapisi hizmetleri\",\n   \"ad_en\": \"Speech and language therapy services\"\n  },\n  {\n   \"kod\": \"H04\",\n   \"ad\": \"Egzersiz ve fiziksel aktivite hizmetleri\",\n   \"ad_en\": \"Exercise and physical activity services\"\n  },\n  {\n   \"kod\": \"H05\",\n   \"ad\": \"Ergoterapi hizmetleri\",\n   \"ad_en\": \"Occupational therapy services\"\n  },\n  {\n   \"kod\": \"H06\",\n   \"ad\": \"Fizyoterapi hizmetleri\",\n   \"ad_en\": \"Physiotherapy services\"\n  },\n  {\n   \"kod\": \"H07\",\n   \"ad\": \"Geleneksel ve Tamamlayıcı Tıp Uygulamaları (GETAT)\",\n   \"ad_en\": \"Traditional and Complementary Medicine practices\"\n  },\n  {\n   \"kod\": \"H08\",\n   \"ad\": \"Güneş te ı hizmetleri\",\n   \"ad_en\": \"Sleep health services\"\n  }\n ],\n \"arketipler\": {\n  \"termal_balneoloji\": {\n   \"ad\": \"Termal ve balneoloji ağırlıklı\",\n   \"cekirdek\": [\n    \"H01\",\n    \"H09\",\n    \"H13\",\n    \"H18\",\n    \"H19\"\n   ],\n   \"olasi\": [\n    \"H06\",\n    \"H11\",\n    \"H21\",\n    \"H22\"\n   ],\n   \"ad_en\": \"Thermal and balneology oriented\"\n  },\n  \"getat\": {\n   \"ad\": \"GETAT ağırlıklı\",\n   \"cekirdek\": [\n    \"H07\",\n    \"H11\",\n    \"H12\"\n   ],\n   \"olasi\": [\n    \"H15\",\n    \"H17\",\n    \"H21\",\n    \"H23\"\n   ],\n   \"ad_en\": \"Traditional medicine oriented\"\n  },\n  \"egzersiz\": {\n   \"ad\": \"Egzersiz ve sportif\",\n   \"cekirdek\": [\n    \"H04\",\n    \"H06\",\n    \"H21\"\n   ],\n   \"olasi\": [\n    \"H02\",\n    \"H05\",\n    \"H11\",\n    \"H18\"\n   ],\n   \"ad_en\": \"Exercise and sports\"\n  },\n  \"psikososyal\": {\n   \"ad\": \"Psikososyal destek\",\n   \"cekirdek\": [\n    \"H12\",\n    \"H15\",\n    \"H17\"\n   ],\n   \"olasi\": [\n    \"H03\",\n    \"H22\",\n    \"H24\"\n   ],\n   \"ad_en\": \"Psychosocial support\"\n  },\n  \"uyku_beslenme\": {\n   \"ad\": \"Uyku ve beslenme\",\n   \"cekirdek\": [\n    \"H02\",\n    \"H21\",\n    \"H24\"\n   ],\n   \"olasi\": [\n    \"H04\",\n    \"H12\",\n    \"H23\"\n   ],\n   \"ad_en\": \"Sleep and nutrition\"\n  },\n  \"rehabilitasyon_destek\": {\n   \"ad\": \"Rehabilitasyon destekli\",\n   \"cekirdek\": [\n    \"H05\",\n    \"H06\",\n    \"H16\"\n   ],\n   \"olasi\": [\n    \"H03\",\n    \"H11\",\n    \"H14\"\n   ],\n   \"ad_en\": \"Rehabilitation supported\"\n  }\n },\n \"arketip_perturbasyon\": {\n  \"olasi_ekleme_olasiligi\": 0.45,\n  \"cekirdek_dusurme_olasiligi\": 0.08\n }\n}", "mevzuat/senaryolar.json": "{\n \"aciklama\": \"Madde 17'ye ilişkin ikincil düzenleme yayımlanmadığı için sağlık turizmi kolu tanımsızdır. Senaryolar bu boşluğun farklı kapanma biçimlerini ve denetim yoğunluğunu karşılaştırır.\",\n \"ortak\": {\n  \"baslangic_yili\": 2026,\n  \"baslangic_merkez_sayisi\": 60,\n  \"yillik_basvuru_tabani\": 16,\n  \"yillik_ziyaretci\": 6200,\n  \"talep_buyume\": 0.06,\n  \"yurt_disi_payi\": 0.24,\n  \"yurt_disi_buyume\": 0.09,\n  \"doluluk_esigi\": 0.3,\n  \"arka_arkaya_zarar_yili\": 2,\n  \"belirsizlik_kabul_orani\": 0.17,\n  \"kayit_disi_egilimi\": 0.22,\n  \"yillik_denetim_kapasitesi\": 30\n },\n \"senaryolar\": [\n  {\n   \"kod\": \"S0\",\n   \"ad\": \"Belirsizlik sürüyor\",\n   \"ad_en\": \"Uncertainty persists\",\n   \"ozet\": \"Madde 17 kapsamındaki ikincil düzenleme hiç yayımlanmaz. Merkezler yurt dışı ziyaretçiyi kabul etmekte tereddüt eder.\",\n   \"ozet_en\": \"The secondary regulation under Article 17 is never issued. Centres hesitate to accept visitors from abroad.\",\n   \"madde17\": \"yok\",\n   \"turizm_kabul_orani\": 0.92,\n   \"denetim_orani\": 0.35,\n   \"unite_turizme_acik\": true\n  },\n  {\n   \"kod\": \"S1\",\n   \"ad\": \"İzin verici düzenleme\",\n   \"ad_en\": \"Permissive regulation\",\n   \"ozet\": \"Düzenleme 2028'de yayımlanır ve sağlık turizmini genel kurallara bağlar. Merkez ve üniteler yurt dışı ziyaretçi kabul eder.\",\n   \"ozet_en\": \"The regulation is issued in 2028 and places health tourism under the general rules. Both centres and units may accept visitors from abroad.\",\n   \"madde17\": \"izin_verici\",\n   \"yururluk_yili\": 2028,\n   \"turizm_kabul_orani\": 0.92,\n   \"denetim_orani\": 0.35,\n   \"unite_turizme_acik\": true\n  },\n  {\n   \"kod\": \"S2\",\n   \"ad\": \"Kısıtlayıcı düzenleme\",\n   \"ad_en\": \"Restrictive regulation\",\n   \"ozet\": \"Düzenleme 2028'de yayımlanır ancak sağlık turizmini yalnızca merkezlere açar, üniteleri kapsam dışında bırakır.\",\n   \"ozet_en\": \"The regulation is issued in 2028 but opens health tourism to centres only, leaving units outside its scope.\",\n   \"madde17\": \"kisitlayici\",\n   \"yururluk_yili\": 2028,\n   \"turizm_kabul_orani\": 0.78,\n   \"denetim_orani\": 0.35,\n   \"unite_turizme_acik\": false\n  },\n  {\n   \"kod\": \"S3\",\n   \"ad\": \"İzin verici ve yoğun denetim\",\n   \"ad_en\": \"Permissive with intensive inspection\",\n   \"ozet\": \"Düzenleme izin verici çıkar, buna karşılık denetim sıklığı iki katına yaklaşır.\",\n   \"ozet_en\": \"The regulation is permissive, but inspection frequency nearly doubles.\",\n   \"madde17\": \"izin_verici\",\n   \"yururluk_yili\": 2028,\n   \"turizm_kabul_orani\": 0.92,\n   \"denetim_orani\": 0.68,\n   \"unite_turizme_acik\": true\n  },\n  {\n   \"kod\": \"S4\",\n   \"ad\": \"Erken ve izin verici düzenleme\",\n   \"ad_en\": \"Early permissive regulation\",\n   \"ozet\": \"Düzenleme 2026 sonunda yayımlanır. Belirsizlik dönemi neredeyse hiç yaşanmaz.\",\n   \"ozet_en\": \"The regulation is issued at the end of 2026. The period of uncertainty barely occurs.\",\n   \"madde17\": \"izin_verici\",\n   \"yururluk_yili\": 2026,\n   \"turizm_kabul_orani\": 0.92,\n   \"denetim_orani\": 0.35,\n   \"unite_turizme_acik\": true\n  }\n ],\n \"uyum_durumlari\": {\n  \"aciklama\": \"Merkezin denetim karşısındaki durumu üç kademede izlenir. Aşağıdaki olasılıklar merkezin zayıf noktası olan kurallar için geçerlidir; diğer kurallarda uyum neredeyse tamdır. Geçiş olasılıkları başlangıç değeridir, gözlemden öğrenilebilir.\",\n  \"durumlar\": [\n   \"iyi\",\n   \"orta\",\n   \"zayif\"\n  ],\n  \"kural_uyum_olasiligi\": {\n   \"iyi\": 0.9,\n   \"orta\": 0.7,\n   \"zayif\": 0.45\n  },\n  \"gecis_cezasiz\": {\n   \"iyi\": [\n    0.9,\n    0.09,\n    0.01\n   ],\n   \"orta\": [\n    0.14,\n    0.76,\n    0.1\n   ],\n   \"zayif\": [\n    0.04,\n    0.22,\n    0.74\n   ]\n  },\n  \"gecis_cezali\": {\n   \"iyi\": [\n    0.94,\n    0.06,\n    0.0\n   ],\n   \"orta\": [\n    0.46,\n    0.5,\n    0.04\n   ],\n   \"zayif\": [\n    0.18,\n    0.52,\n    0.3\n   ]\n  },\n  \"saglam_kural_uyumu\": 0.998\n }\n}", "mevzuat/belirsizlik_haritasi.json": "{\n \"aciklama\": \"Yönetmelik metninin madde madde taranmasıyla çıkarılan belirsizlik kataloğu. Her kayıt, hükmün uygulanmasını tek başına mümkün kılmayan bir eksikliği gösterir. Sınıflandırma metne dayanır; yorum içermez.\",\n \"turler\": {\n  \"ikincil_duzenleme_yok\": {\n   \"ad\": \"İkincil düzenlemeye bırakılmış, henüz yayımlanmamış\",\n   \"ad_en\": \"Deferred to secondary regulation, not yet issued\"\n  },\n  \"tanimsiz_kavram\": {\n   \"ad\": \"Yönetmelikte tanımı bulunmayan kavram\",\n   \"ad_en\": \"Concept used but not defined\"\n  },\n  \"olcutsuz_takdir\": {\n   \"ad\": \"Ölçüt verilmeden idareye bırakılmış takdir\",\n   \"ad_en\": \"Discretion left without criteria\"\n  },\n  \"acik_uclu_liste\": {\n   \"ad\": \"Açık uçlu sayma\",\n   \"ad_en\": \"Open-ended enumeration\"\n  },\n  \"denetimde_karsiligi_yok\": {\n   \"ad\": \"EK-4 denetim formunda karşılığı yok\",\n   \"ad_en\": \"No counterpart in the Annex 4 form\"\n  },\n  \"metin_ici_tutarsizlik\": {\n   \"ad\": \"Metin içi tutarsızlık\",\n   \"ad_en\": \"Internal inconsistency\"\n  }\n },\n \"etki_alanlari\": {\n  \"ruhsat\": {\n   \"tr\": \"Ruhsatlandırma\",\n   \"en\": \"Licensing\"\n  },\n  \"isletme\": {\n   \"tr\": \"İşletme\",\n   \"en\": \"Operation\"\n  },\n  \"denetim\": {\n   \"tr\": \"Denetim\",\n   \"en\": \"Inspection\"\n  },\n  \"turizm\": {\n   \"tr\": \"Sağlık turizmi\",\n   \"en\": \"Health tourism\"\n  }\n },\n \"kayitlar\": [\n  {\n   \"kod\": \"B01\",\n   \"dayanak\": \"17/1\",\n   \"tur\": \"ikincil_duzenleme_yok\",\n   \"etki\": [\n    \"turizm\",\n    \"isletme\",\n    \"denetim\"\n   ],\n   \"agirlik\": 3,\n   \"metin\": \"Sağlık turizmi kapsamında sunulacak esenlik hizmetlerinin usul ve esasları Bakanlığa bırakılmış, düzenleme yayımlanmamıştır. Merkez, yurt dışında ikamet eden ziyaretçiye hizmet verirken kurala uygun mu aykırı mı davrandığını bilememektedir.\",\n   \"metin_en\": \"The procedures for wellness services within health tourism are left to the Ministry and have not been issued. A centre cannot know whether serving a visitor resident abroad complies with the rules.\"\n  },\n  {\n   \"kod\": \"B02\",\n   \"dayanak\": \"17\",\n   \"tur\": \"metin_ici_tutarsizlik\",\n   \"etki\": [\n    \"turizm\"\n   ],\n   \"agirlik\": 2,\n   \"metin\": \"Madde başlığı uluslararası sağlık turizmi yetkisinden söz ederken fıkra metni yalnızca sağlık turizmi kapsamında demektedir. Yurt içi sağlık turizminin kapsama girip girmediği metinden anlaşılmamaktadır.\",\n   \"metin_en\": \"The article heading refers to international health tourism while the paragraph says only within the scope of health tourism. Whether domestic health tourism is covered cannot be determined from the text.\"\n  },\n  {\n   \"kod\": \"B03\",\n   \"dayanak\": \"4/1-c\",\n   \"tur\": \"acik_uclu_liste\",\n   \"etki\": [\n    \"ruhsat\",\n    \"denetim\"\n   ],\n   \"agirlik\": 3,\n   \"metin\": \"Esenlik hizmeti tanımı yirmi dört hizmet türünü saydıktan sonra ile benzer nitelikteki hizmetleri ifadesiyle listeyi açık bırakmaktadır. Benzerliğin ölçütü verilmemiştir; bir hizmetin kapsama girip girmediği tartışmalı kalmaktadır.\",\n   \"metin_en\": \"After enumerating twenty-four service types the definition leaves the list open with the phrase and services of a similar nature. No criterion of similarity is given.\"\n  },\n  {\n   \"kod\": \"B04\",\n   \"dayanak\": \"4/1-c\",\n   \"tur\": \"tanimsiz_kavram\",\n   \"etki\": [\n    \"isletme\",\n    \"denetim\"\n   ],\n   \"agirlik\": 3,\n   \"metin\": \"Esenlik hizmeti tedavi amacı taşımaksızın sunulan hizmet olarak tanımlanmıştır. Tedavi amacının nasıl belirleneceği, rehabilitasyon ve fizyoterapi gibi hizmetlerin hangi noktada tedaviye dönüştüğü belirtilmemiştir.\",\n   \"metin_en\": \"Wellness service is defined as provided without therapeutic purpose. How therapeutic purpose is determined, and at what point rehabilitation or physiotherapy becomes treatment, is not stated.\"\n  },\n  {\n   \"kod\": \"B05\",\n   \"dayanak\": \"10/8-d\",\n   \"tur\": \"tanimsiz_kavram\",\n   \"etki\": [\n    \"isletme\",\n    \"denetim\"\n   ],\n   \"agirlik\": 3,\n   \"metin\": \"Nekahet dönemindeki hastaların hizmet alamayacağı düzenlenmiş ancak nekahet döneminin tanımı, süresi ve nasıl belgeleneceği verilmemiştir. Yaptırımı ağır olan bir yasak, ölçütü olmayan bir kavrama bağlanmıştır.\",\n   \"metin_en\": \"Patients in convalescence may not receive services, but the definition, duration and documentation of convalescence are not given. A prohibition with severe sanctions rests on a concept without criteria.\"\n  },\n  {\n   \"kod\": \"B06\",\n   \"dayanak\": \"10/4\",\n   \"tur\": \"olcutsuz_takdir\",\n   \"etki\": [\n    \"ruhsat\",\n    \"denetim\"\n   ],\n   \"agirlik\": 2,\n   \"metin\": \"Hizmetin niteliğine uygun mekân sağlanacağı düzenlenmiştir. Uygunluğun ölçütü, metrekare ya da donanım karşılığı verilmemiştir; buna karşılık EK-4'ün beşinci sorusu bu şartı denetlemektedir.\",\n   \"metin_en\": \"Space appropriate to the nature of the service must be provided. No criterion, area or equipment requirement is given, yet Annex 4 question five inspects this condition.\"\n  },\n  {\n   \"kod\": \"B07\",\n   \"dayanak\": \"10/2\",\n   \"tur\": \"olcutsuz_takdir\",\n   \"etki\": [\n    \"ruhsat\",\n    \"isletme\"\n   ],\n   \"agirlik\": 2,\n   \"metin\": \"Esenlik hizmetinin gerektirdiği tıbbi cihazların Bakanlık izniyle bulundurulabileceği belirtilmiştir. Hangi cihazların gerekli sayılacağı, izin başvurusunun usulü ve süresi düzenlenmemiştir.\",\n   \"metin_en\": \"Medical devices required by the service may be kept with Ministry permission. Which devices count as required, and the procedure and timing of the permission, are not regulated.\"\n  },\n  {\n   \"kod\": \"B08\",\n   \"dayanak\": \"6/1\",\n   \"tur\": \"ikincil_duzenleme_yok\",\n   \"etki\": [\n    \"ruhsat\"\n   ],\n   \"agirlik\": 2,\n   \"metin\": \"Spor kulüpleri ile yaşlı ve engelli bakım merkezleri bünyesinde açılış, Gençlik ve Spor Bakanlığı ya da Aile ve Sosyal Hizmetler Bakanlığı iznine bağlanmıştır. Bu izinlerin ölçütü ve süreci Yönetmelikte yer almamaktadır.\",\n   \"metin_en\": \"Opening within sports clubs or care centres requires permission from another ministry. The criteria and process for these permissions do not appear in the regulation.\"\n  },\n  {\n   \"kod\": \"B09\",\n   \"dayanak\": \"12/1\",\n   \"tur\": \"olcutsuz_takdir\",\n   \"etki\": [\n    \"isletme\"\n   ],\n   \"agirlik\": 1,\n   \"metin\": \"Tıbbi laboratuvar ve görüntüleme hizmetlerinin hizmet alımıyla karşılanabileceği düzenlenmiştir. Bunlar dışındaki hizmetlerin hizmet alımıyla karşılanıp karşılanamayacağı açık değildir.\",\n   \"metin_en\": \"Laboratory and imaging services may be procured externally. Whether other services may be procured in the same way is not clear.\"\n  },\n  {\n   \"kod\": \"B10\",\n   \"dayanak\": \"18/2\",\n   \"tur\": \"olcutsuz_takdir\",\n   \"etki\": [\n    \"denetim\"\n   ],\n   \"agirlik\": 2,\n   \"metin\": \"Telafisi güç durumların ortaya çıkması hâlinde faaliyetin valilikçe durdurulacağı düzenlenmiştir. Bu durumların ölçütü verilmemiş, takdir tamamen idareye bırakılmıştır.\",\n   \"metin_en\": \"Where situations difficult to remedy arise, the governorship suspends operations. No criterion is given and the discretion rests entirely with the administration.\"\n  },\n  {\n   \"kod\": \"B11\",\n   \"dayanak\": \"EK-4\",\n   \"tur\": \"metin_ici_tutarsizlik\",\n   \"etki\": [\n    \"denetim\"\n   ],\n   \"agirlik\": 1,\n   \"metin\": \"Denetim formunda yirmi iki numara ayrılmış olmasına karşın on iki numaralı soru bulunmamaktadır. Ayrıca Yönetmelik metni nekahet, formun üçüncü sorusu nekahat yazımını kullanmaktadır.\",\n   \"metin_en\": \"The inspection form reserves twenty-two numbers but question twelve is absent. The regulation spells the term one way and the third question of the form another.\"\n  },\n  {\n   \"kod\": \"B12\",\n   \"dayanak\": \"EK-4\",\n   \"tur\": \"denetimde_karsiligi_yok\",\n   \"etki\": [\n    \"denetim\",\n    \"ruhsat\"\n   ],\n   \"agirlik\": 3,\n   \"metin\": \"Denetim formunun yirmi bir sorusundan hiçbiri Yönetmeliğin yapısal tanımlarını sorgulamamaktadır. Kapalı alan eşiği, oda sayısı, kurum izinleri ve uzman tabipler için öngörülen altmış yaş şartı ruhsat aşamasında aranmakta, işletme sırasında denetlenmemektedir.\",\n   \"metin_en\": \"None of the twenty-one questions inspects the structural definitions. Closed area, room count, institutional permits and the sixty-year condition for specialist physicians are sought at licensing but not inspected during operation.\"\n  },\n  {\n   \"kod\": \"B13\",\n   \"dayanak\": \"EK-4\",\n   \"tur\": \"denetimde_karsiligi_yok\",\n   \"etki\": [\n    \"turizm\",\n    \"denetim\"\n   ],\n   \"agirlik\": 3,\n   \"metin\": \"Denetim formunda sağlık turizmine ilişkin tek bir soru bulunmamaktadır. Yönetmelik bir kategori açmakta, kendi denetim aracı o kategoriyi hiç sormamaktadır.\",\n   \"metin_en\": \"The inspection form contains no question on health tourism. The regulation opens a category that its own inspection instrument never asks about.\"\n  },\n  {\n   \"kod\": \"B14\",\n   \"dayanak\": \"16/1\",\n   \"tur\": \"ikincil_duzenleme_yok\",\n   \"etki\": [\n    \"isletme\"\n   ],\n   \"agirlik\": 1,\n   \"metin\": \"Tanıtım ve bilgilendirme, 33075 sayılı Yönetmeliğe atıfla düzenlenmiştir. Esenlik hizmetlerine özgü tanıtım sınırları belirlenmemiş, açık uçlu hizmet listesiyle birlikte kapsam belirsiz kalmıştır.\",\n   \"metin_en\": \"Promotion is regulated by reference to another regulation. No wellness-specific limits are set, and together with the open-ended service list the scope remains unclear.\"\n  }\n ]\n}", "mevzuat/uyum_maliyeti.json": "{\n \"aciklama\": \"Yönetmeliğin yüklediği uyum maliyetleri. Tutarlar gerçek piyasa verisi değildir; göreli birim olarak verilmiştir ve arayüzden değiştirilebilir. Amaç mutlak maliyeti kestirmek değil, hangi iş modelinin eşiğin altına düştüğünü göstermektir.\",\n \"birim\": \"yillik_goreli_birim\",\n \"gelir\": {\n  \"kisi_basi\": 1.0,\n  \"aciklama\": \"Hizmet verilen kişi başına yıllık gelir birimi.\"\n },\n \"kalemler\": [\n  {\n   \"kod\": \"C01\",\n   \"dayanak\": \"4/1-f, 4/1-ı\",\n   \"ad\": \"Kapalı alan\",\n   \"ad_en\": \"Closed area\",\n   \"tur\": \"alana_bagli\",\n   \"birim_maliyet\": 0.16,\n   \"aciklama\": \"Metrekare başına yıllık kira ve amortisman. Müstakil binada merkez için en az 500 m², ünite için en az 300 m² zorunludur.\",\n   \"aciklama_en\": \"Annual rent and depreciation per square metre. At least 500 m² for a centre and 300 m² for a unit in a detached building.\"\n  },\n  {\n   \"kod\": \"C02\",\n   \"dayanak\": \"10/3\",\n   \"ad\": \"Acil müdahale odası\",\n   \"ad_en\": \"Emergency intervention room\",\n   \"tur\": \"sabit\",\n   \"birim_maliyet\": 18,\n   \"aciklama\": \"Kuruluş bünyesinde mevcutsa şart sağlanmış sayıldığından, konaklama tesisi ve bakım merkezlerinde maliyet doğurmaz.\",\n   \"aciklama_en\": \"Deemed satisfied where the host establishment already has one, so it creates no cost in accommodation facilities and care centres.\",\n   \"yalnizca_yerlesim\": [\n    \"mustakil_bina\"\n   ]\n  },\n  {\n   \"kod\": \"C03\",\n   \"dayanak\": \"11/2, 11/6\",\n   \"ad\": \"Tam zamanlı mesul müdür\",\n   \"ad_en\": \"Full-time responsible manager\",\n   \"tur\": \"sabit\",\n   \"birim_maliyet\": 62,\n   \"aciklama\": \"Tabip ya da uzman tabip olmak, Türkiye'de en az üç yıl tabiplik yapmış olmak ve başka hiçbir sağlık kuruluşunda çalışmamak zorundadır. Tam zamanlılık ve münhasırlık maliyeti yükseltir.\",\n   \"aciklama_en\": \"Must be a physician with at least three years of practice in Turkey and may not work at any other health institution. Exclusivity raises the cost.\"\n  },\n  {\n   \"kod\": \"C04\",\n   \"dayanak\": \"10/6\",\n   \"ad\": \"Altmış yaş üstü uzman tabip\",\n   \"ad_en\": \"Specialist physician over sixty\",\n   \"tur\": \"kosullu\",\n   \"birim_maliyet\": 34,\n   \"kosul_alan\": \"uzman_tabip_var\",\n   \"aciklama\": \"Uzman tabip çalıştırılmak istenirse yalnızca altmış yaş üzeri istihdam edilebilir. Havuz dar olduğu için ücret primi doğar.\",\n   \"aciklama_en\": \"Only specialists over sixty may be employed. The narrow pool creates a wage premium.\"\n  },\n  {\n   \"kod\": \"C05\",\n   \"dayanak\": \"13/2\",\n   \"ad\": \"Hastane iş birliği protokolü\",\n   \"ad_en\": \"Hospital cooperation agreement\",\n   \"tur\": \"sabit\",\n   \"birim_maliyet\": 14,\n   \"aciklama\": \"Özel, kamu ya da üniversite hastanesi veya 3000 m² ve on uzman tabip kadrolu tıp merkeziyle iş birliği zorunludur.\",\n   \"aciklama_en\": \"Cooperation with a hospital or a qualifying medical centre is compulsory.\"\n  },\n  {\n   \"kod\": \"C06\",\n   \"dayanak\": \"14/1, 14/2, 14/4\",\n   \"ad\": \"Bilgi yönetim sistemi ve arşiv\",\n   \"ad_en\": \"Information system and archive\",\n   \"tur\": \"sabit\",\n   \"birim_maliyet\": 11,\n   \"aciklama\": \"Bakanlığın kayıt tescil sisteminde kayıtlı sağlık bilgi yönetim sistemi, merkezî sağlık veri sistemine aktarım, elektronik imza ve arşivleme zorunludur.\",\n   \"aciklama_en\": \"A registered health information management system, transfer to the central data system, electronic signature and archiving are compulsory.\"\n  },\n  {\n   \"kod\": \"C07\",\n   \"dayanak\": \"10/7, 15/1\",\n   \"ad\": \"Personel belgeleri ve kimlik kartları\",\n   \"ad_en\": \"Personnel certificates and identity cards\",\n   \"tur\": \"personele_bagli\",\n   \"birim_maliyet\": 0.9,\n   \"aciklama\": \"Her sağlık meslek mensubu için personel çalışma belgesi, tüm personel için karekodlu kimlik kartı düzenlenir.\",\n   \"aciklama_en\": \"A work certificate for every health professional and a QR-coded identity card for all personnel.\"\n  },\n  {\n   \"kod\": \"C08\",\n   \"dayanak\": \"10/8-f\",\n   \"ad\": \"Ürün satışı yasağı\",\n   \"ad_en\": \"Prohibition on product sales\",\n   \"tur\": \"gelir_kaybi\",\n   \"birim_maliyet\": 0.14,\n   \"aciklama\": \"Merkez veya ünitede hiçbir ürün satılamaz. Esenlik işletmeciliğinde perakende önemli bir gelir kalemi olduğundan bu yasak doğrudan gelir kaybıdır.\",\n   \"aciklama_en\": \"No product may be sold on the premises. Retail is a significant revenue line in wellness operations, so the prohibition is a direct loss.\"\n  }\n ]\n}"}</script>

<script>
/* Ziyaretçi modeli.

   Ağın yapısı uzman tarafından belirlenir: hangi değişkenler var, hangisi
   hangisine bağlı. Olasılık tablolarının içeriği ise veriden öğrenilir.
   Elle yazılmış tablo yoktur.

   Öğrenme, sayımlara düzgün dağılımlı bir Dirichlet öncülü eklenerek yapılır.
   Öncül gücü küçük tutulur; amacı hiç gözlem düşmemiş satırları tanımsız
   bırakmamaktır. Kayıt sayısı arttıkça öncülün etkisi kaybolur.
*/

class Model {
  constructor(yapi, kayitlar, oncul = 1) {
    this.yapi = yapi;
    this.dugumler = yapi.dugumler;
    this.oncul = oncul;
    this.sira = this.topolojikSira();
    this.egit(kayitlar || []);
  }

  topolojikSira() {
    const kalan = new Set(Object.keys(this.dugumler));
    const yerlesen = new Set(), sira = [];
    while (kalan.size) {
      const hazir = [...kalan].filter(a =>
        (this.dugumler[a].ebeveynler || []).every(e => yerlesen.has(e)));
      if (!hazir.length) throw new Error("Ağda döngü var");
      hazir.sort().forEach(a => { sira.push(a); yerlesen.add(a); kalan.delete(a); });
    }
    return sira;
  }

  anahtar(ad, kayit) {
    const eb = this.dugumler[ad].ebeveynler || [];
    return eb.length ? eb.map(e => kayit[e]).join("|") : "*";
  }

  /* Bir düğümün ebeveyn bileşimlerinin tamamı. Veri düşmemiş satırların da
     tabloda görünmesi gerekir; eksik olduklarını göstermek için. */
  tumAnahtarlar(ad) {
    const eb = this.dugumler[ad].ebeveynler || [];
    if (!eb.length) return ["*"];
    let liste = [""];
    for (const e of eb) {
      const yeni = [];
      for (const p of liste) for (const d of this.dugumler[e].durumlar)
        yeni.push(p ? p + "|" + d : d);
      liste = yeni;
    }
    return liste;
  }

  egit(kayitlar) {
    this.kayitSayisi = kayitlar.length;
    this.sayim = {}; this.kpt = {};
    for (const ad of this.sira) {
      const k = this.dugumler[ad].durumlar.length;
      this.sayim[ad] = {};
      for (const a of this.tumAnahtarlar(ad)) this.sayim[ad][a] = new Array(k).fill(0);
    }
    for (const kayit of kayitlar) {
      for (const ad of this.sira) {
        if (!(ad in kayit)) continue;
        const a = this.anahtar(ad, kayit);
        const i = this.dugumler[ad].durumlar.indexOf(kayit[ad]);
        if (i >= 0 && this.sayim[ad][a]) this.sayim[ad][a][i] += 1;
      }
    }
    for (const ad of this.sira) {
      this.kpt[ad] = {};
      for (const a of Object.keys(this.sayim[ad])) {
        const s = this.sayim[ad][a];
        const t = s.reduce((x, y) => x + y, 0) + this.oncul * s.length;
        this.kpt[ad][a] = s.map(v => (v + this.oncul) / t);
      }
    }
  }

  /* Satırın kaç gözleme dayandığı. Az gözlemli satırlar arayüzde işaretlenir. */
  gozlem(ad, a) {
    return (this.sayim[ad][a] || []).reduce((x, y) => x + y, 0);
  }

  zayifSatirlar(esik = 5) {
    const liste = [];
    for (const ad of this.sira)
      for (const a of Object.keys(this.sayim[ad]))
        if (this.gozlem(ad, a) < esik) liste.push({ dugum: ad, anahtar: a, gozlem: this.gozlem(ad, a) });
    return liste;
  }

  sec(durumlar, agirliklar, rastgele) {
    const t = agirliklar.reduce((a, b) => a + b, 0);
    let e = rastgele() * t, b = 0;
    for (let i = 0; i < durumlar.length; i++) { b += agirliklar[i]; if (e <= b) return i; }
    return durumlar.length - 1;
  }

  /* Örneklemeyi adım adım kaydeder: hangi ebeveyn bileşimi hangi satırı seçti,
     o satır kaç gözleme dayanıyor, hangi değer çekildi. */
  uretIzli(rastgele = Math.random) {
    const atama = {}, iz = [];
    for (const ad of this.sira) {
      const d = this.dugumler[ad];
      const a = this.anahtar(ad, atama);
      const satir = this.kpt[ad][a];
      const i = this.sec(d.durumlar, satir, rastgele);
      atama[ad] = d.durumlar[i];
      iz.push({
        dugum: ad, anahtar: a,
        ebeveynler: (d.ebeveynler || []).map(e => ({ ad: e, deger: atama[e] })),
        durumlar: d.durumlar, olasiliklar: satir,
        secilen: d.durumlar[i], olasilik: satir[i], gozlem: this.gozlem(ad, a),
      });
    }
    return { atama, iz };
  }

  uret(rastgele = Math.random) { return this.uretIzli(rastgele).atama; }

  uretCoklu(n, rastgele = Math.random) {
    const c = [];
    for (let i = 0; i < n; i++) c.push(this.uret(rastgele));
    return c;
  }
}

/* Kayıt setinden değişken dağılımlarını çıkarır. Veri sekmesinde gösterilir. */
function dagilim(kayitlar, dugum, durumlar) {
  const s = {};
  durumlar.forEach(d => s[d] = 0);
  kayitlar.forEach(k => { if (k[dugum] in s) s[k[dugum]] += 1; });
  const n = kayitlar.length || 1;
  return durumlar.map(d => ({ durum: d, adet: s[d], oran: s[d] / n }));
}

/* Yineleme anahtarından türeyen üreteç. Aynı anahtar aynı diziyi verir. */
function uretec(anahtar) {
  let s = (anahtar >>> 0) || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

/* Merkezlerin üretilmesi, kuralların uygulanması ve eşleştirme.

   Üç değerli sonuç kullanılır. "Belirsiz" bir modelleme tercihi değildir:
   Madde 17 sağlık turizmi kapsamındaki hizmetlerin usul ve esaslarını
   Bakanlığa bırakmış, ikincil düzenleme yayımlanmamış ve EK-4 denetim
   formunda konuyla ilgili tek bir soru bulunmamaktadır.
*/

const UYGUN = "uygun", DEGIL = "uygun_degil", BELIRSIZ = "belirsiz";

const YERLESIMLER = ["mustakil_bina", "konaklama_tesisi", "yasli_bakim_merkezi",
                     "engelli_bakim_merkezi", "spor_kulubu"];

/* ---------------- yapısal kurallar: ruhsat aşaması ---------------- */

function ilgili(kural, kayit) {
  const ka = kural.kosul_alan;
  if (ka !== undefined) {
    if (kural.kosul_degerler) { if (!kural.kosul_degerler.includes(kayit[ka])) return false; }
    else if (kayit[ka] !== kural.kosul_deger) return false;
  }
  const eka = kural.ek_kosul_alan;
  if (eka !== undefined && kayit[eka] !== kural.ek_kosul_deger) return false;
  return true;
}

function ruhsatIncele(basvuru, yapisal) {
  const engel = [];
  for (const k of yapisal.kurallar) {
    if (k.tur === "belirsiz" || (k.asama && k.asama !== "ruhsat")) continue;
    if (!ilgili(k, basvuru)) continue;
    const v = basvuru[k.alan];
    if (v === undefined || v === null) continue;
    let gecti = true;
    if (k.tur === "esik") gecti = v >= k.asgari;
    else if (k.tur === "tavan") gecti = v <= k.azami;
    else gecti = v === k.beklenen;
    if (!gecti) engel.push({ kod: k.kod, dayanak: k.dayanak,
                             metin: k.aciklama, metin_en: k.aciklama_en || "" });
  }
  return { verilir: engel.length === 0, engel };
}

/* ---------------- merkez üretimi ---------------- */

function sepet(arketip, hizmetler, r) {
  const a = hizmetler.arketipler[arketip], p = hizmetler.arketip_perturbasyon;
  const s = new Set();
  a.cekirdek.forEach(h => { if (r() > p.cekirdek_dusurme_olasiligi) s.add(h); });
  a.olasi.forEach(h => { if (r() < p.olasi_ekleme_olasiligi) s.add(h); });
  return [...s];
}

function basvuruUret(r, yapisalUyum) {
  const yerlesim = YERLESIMLER[Math.floor(r() * YERLESIMLER.length)];
  const tur = r() < 0.5 ? "merkez" : "unite";
  const asgari = yerlesim === "mustakil_bina" ? (tur === "merkez" ? 500 : 300) : 0;
  const b = {
    yerlesim, tur,
    kapali_alan_m2: asgari ? Math.round(asgari * (r() < yapisalUyum
      ? 1 + r() * 1.6 : 0.55 + r() * 0.43)) : null,
    oda_sayisi: yerlesim === "konaklama_tesisi"
      ? (r() < yapisalUyum ? [10, 12, 18, 24, 40, 70][Math.floor(r() * 6)]
                           : [6, 8, 9][Math.floor(r() * 3)]) : null,
    mustakil_giris: yerlesim === "mustakil_bina" ? r() < yapisalUyum : true,
    turizm_isletmesi_belgesi: yerlesim === "konaklama_tesisi" ? r() < yapisalUyum : true,
    kurum_izni: ["spor_kulubu", "yasli_bakim_merkezi", "engelli_bakim_merkezi"].includes(yerlesim)
      ? r() < yapisalUyum : true,
    uzman_tabip_var: r() < 0.5,
    mesul_mudur_tabiplik_yili: r() < yapisalUyum
      ? [3, 4, 6, 9, 14, 20][Math.floor(r() * 6)] : [1, 2][Math.floor(r() * 2)],
    mesul_mudur_baska_kurumda: r() > yapisalUyum,
    ruhsattan_faaliyete_ay: r() < yapisalUyum
      ? [1, 2, 3, 4, 5, 6][Math.floor(r() * 6)] : [7, 9][Math.floor(r() * 2)],
  };
  b.uzman_tabip_asgari_yas = b.uzman_tabip_var
    ? (r() < yapisalUyum ? [61, 63, 66, 70][Math.floor(r() * 4)]
                         : [46, 55, 58][Math.floor(r() * 3)]) : null;
  return b;
}

function merkezleriUret(adet, hizmetler, yapisal, ek4, r,
                               { yapisalUyum = 0.9, denetimUyum = 0.985 } = {}) {
  const arketipler = Object.keys(hizmetler.arketipler).sort();
  const ek4Alanlari = ek4.kurallar.filter(k => k.duzey === "merkez");
  const kabul = [], red = [], redNedeni = {};
  let sayac = 0, deneme = 0;

  while (kabul.length < adet && deneme < adet * 40) {
    deneme++;
    const b = basvuruUret(r, yapisalUyum);
    const s = ruhsatIncele(b, yapisal);
    if (!s.verilir) {
      red.push({ basvuru: b, engel: s.engel });
      s.engel.forEach(e => redNedeni[e.dayanak] = (redNedeni[e.dayanak] || 0) + 1);
      continue;
    }
    sayac++;
    const ark = arketipler[Math.floor(r() * arketipler.length)];
    const m = Object.assign({}, b, {
      kimlik: "M" + String(sayac).padStart(3, "0"),
      arketip: ark,
      hizmet_sepeti: sepet(ark, hizmetler, r),
      kapasite: Math.round((b.tur === "merkez" ? 150 : 85) * (0.75 + r() * 0.75)),
      ihlaller: [],
    });
    ek4Alanlari.forEach(k => {
      const uygun = r() < denetimUyum;
      m[k.alan] = uygun ? k.beklenen : !k.beklenen;
      if (!uygun) m.ihlaller.push({ kod: "S" + String(k.soru_no).padStart(2, "0"),
                                    dayanak: k.dayanak, metin: k.soru,
                                    metin_en: k.soru_en || "" });
    });
    m.durum = m.ihlaller.length ? DEGIL : UYGUN;
    kabul.push(m);
  }
  return { merkezler: kabul, red, redNedeni, basvuru: deneme };
}

/* ---------------- eşleştirme ---------------- */

function turizmDurumu(senaryo, merkez) {
  const m17 = senaryo.madde17 || "yok";
  if (m17 === "yok") return BELIRSIZ;
  if (m17 === "kisitlayici" && merkez.tur === "unite") return DEGIL;
  return UYGUN;
}

function eslestir(ziyaretciler, merkezler, hizmetler, senaryo, r,
                         { belirsizlikIstahi = 0.17 } = {}) {
  const acik = merkezler.filter(m => m.durum === UYGUN);
  const kalan = {}; acik.forEach(m => kalan[m.kimlik] = m.kapasite);
  const yuk = {}; merkezler.forEach(m => yuk[m.kimlik] = 0);

  /* Yurt dışı ziyaretçi kabulü merkezin kararıdır, her ziyaretçide yeniden
     çekilmez. Durum tanımsızken merkezlerin çoğu riski almaz. */
  const kabul = {};
  acik.forEach(m => {
    const d = turizmDurumu(senaryo, m);
    kabul[m.kimlik] = d === UYGUN ? true : (d === BELIRSIZ ? r() < belirsizlikIstahi : false);
  });

  const sonuc = [];
  const sayim = { uygun: 0, belirsiz: 0, uygun_degil: 0 };
  const neden = {};
  const ekle = (d, k) => { neden[k] = (neden[k] || 0) + 1; sayim[d] += 1; };

  for (const z of ziyaretciler) {
    const kayit = { ziyaretci: z, merkez: null, durum: null, neden: null };

    if (z.nekahet === "evet") {                       // Madde 10/8-d
      kayit.durum = DEGIL; kayit.neden = "10/8-d";
      ekle(DEGIL, "10/8-d"); sonuc.push(kayit); continue;
    }
    const cekirdek = hizmetler.arketipler[z.talep_arketipi].cekirdek;
    const esik = Math.max(1, Math.floor(cekirdek.length / 2));
    const hizmetVeren = acik.filter(m =>
      cekirdek.filter(h => m.hizmet_sepeti.includes(h)).length >= esik);
    if (!hizmetVeren.length) {                        // aradığı hizmeti sunan merkez yok
      kayit.durum = DEGIL; kayit.neden = "hizmet_yok";
      ekle(DEGIL, "hizmet_yok"); sonuc.push(kayit); continue;
    }
    let adaylar = hizmetVeren.filter(m => kalan[m.kimlik] > 0);
    if (!adaylar.length) {                            // hizmet var, kapasite dolu
      kayit.durum = DEGIL; kayit.neden = "kapasite_dolu";
      ekle(DEGIL, "kapasite_dolu"); sonuc.push(kayit); continue;
    }
    if (z.ikamet === "yurt_disi") {                   // Madde 17
      const izinli = adaylar.filter(m => kabul[m.kimlik]);
      if (!izinli.length) {
        const d = turizmDurumu(senaryo, adaylar[0]);
        kayit.durum = d === BELIRSIZ ? BELIRSIZ : DEGIL;
        kayit.neden = "17/1";
        ekle(kayit.durum, "17/1"); sonuc.push(kayit); continue;
      }
      adaylar = izinli;
    }
    const m = adaylar[Math.floor(r() * adaylar.length)];
    kalan[m.kimlik] -= 1; yuk[m.kimlik] += 1;
    kayit.merkez = m.kimlik; kayit.durum = UYGUN;
    ekle(UYGUN, "hizmet"); sonuc.push(kayit);
  }

  const toplam = ziyaretciler.length || 1;
  return {
    kayitlar: sonuc, sayim, neden, yuk,
    oran: { uygun: sayim.uygun / toplam, belirsiz: sayim.belirsiz / toplam,
            uygun_degil: sayim.uygun_degil / toplam },
    doluluk: acik.length
      ? acik.reduce((s, m) => s + yuk[m.kimlik], 0) / acik.reduce((s, m) => s + m.kapasite, 0) : 0,
  };
}

/* Segment kırılımı: hangi ziyaretçi grubu ne sonuç aldı. */
function kirilim(kayitlar, alan) {
  const t = {};
  for (const k of kayitlar) {
    const g = k.ziyaretci[alan];
    if (!t[g]) t[g] = { uygun: 0, belirsiz: 0, uygun_degil: 0, toplam: 0 };
    t[g][k.durum] += 1; t[g].toplam += 1;
  }
  return t;
}

/* Uyum maliyeti, yaşayabilirlik ve duyarlılık analizi.

   Maliyet tutarları gerçek piyasa verisi değildir; göreli birimdir ve
   arayüzden değiştirilebilir. Amaç mutlak maliyeti kestirmek değil, hangi
   iş modelinin eşiğin altına düştüğünü göstermektir.
*/


function merkezMaliyeti(m, maliyet) {
  const kalem = [];
  let toplam = 0;
  for (const k of maliyet.kalemler) {
    if (k.yalnizca_yerlesim && !k.yalnizca_yerlesim.includes(m.yerlesim)) continue;
    if (k.tur === "kosullu" && !m[k.kosul_alan]) continue;
    let d = 0;
    if (k.tur === "alana_bagli") d = (m.kapali_alan_m2 || (m.tur === "merkez" ? 320 : 190)) * k.birim_maliyet;
    else if (k.tur === "personele_bagli") d = Math.max(4, Math.round(m.kapasite / 18)) * k.birim_maliyet;
    else if (k.tur === "gelir_kaybi") d = m.kapasite * maliyet.gelir.kisi_basi * k.birim_maliyet;
    else d = k.birim_maliyet;
    kalem.push({ kod: k.kod, ad: k.ad, ad_en: k.ad_en, dayanak: k.dayanak, tutar: d });
    toplam += d;
  }
  return { toplam, kalem };
}

/* Gelir hizmet verilen kişi sayısından gelir; doluluk bilinmiyorsa varsayılan
   kullanılır. Eşiğin altına düşen merkez uzun vadede ayakta kalamaz. */
function yasayabilirlik(merkezler, maliyet, yuk, varsayilanDoluluk = 0.7) {
  return merkezler.map(m => {
    const mal = merkezMaliyeti(m, maliyet);
    const kisi = yuk && yuk[m.kimlik] !== undefined ? yuk[m.kimlik]
                                                   : Math.round(m.kapasite * varsayilanDoluluk);
    const gelir = kisi * maliyet.gelir.kisi_basi;
    return { kimlik: m.kimlik, yerlesim: m.yerlesim, tur: m.tur, kapasite: m.kapasite,
             kisi, gelir, maliyet: mal.toplam, kalem: mal.kalem,
             marj: gelir - mal.toplam, ayakta: gelir - mal.toplam > 0 };
  });
}

function yasayabilirlikOzeti(liste) {
  const grup = {};
  for (const y of liste) {
    const a = y.yerlesim + "|" + y.tur;
    if (!grup[a]) grup[a] = { yerlesim: y.yerlesim, tur: y.tur, adet: 0, ayakta: 0, marj: 0 };
    grup[a].adet += 1;
    grup[a].ayakta += y.ayakta ? 1 : 0;
    grup[a].marj += y.marj;
  }
  return Object.values(grup).map(g => ({
    yerlesim: g.yerlesim, tur: g.tur, adet: g.adet, ayakta: g.ayakta,
    oran: g.ayakta / g.adet, ortalama_marj: g.marj / g.adet,
  })).sort((a, b) => a.oran - b.oran);
}

/* Duyarlılık: her parametre tek tek aşağı ve yukarı oynatılır, çıktıdaki
   değişim ölçülür. Çıktı ne koyduğumuza bağlıysa bunu göstermek, gizlemekten
   daha dürüsttür. */
const PARAMETRELER = [
  { kod: "merkez_sayisi",  taban: 60,   alt: 40,   ust: 100 },
  { kod: "ziyaretci",      taban: 6000, alt: 4000, ust: 9000 },
  { kod: "yapisal_uyum",   taban: 0.90, alt: 0.75, ust: 1.00 },
  { kod: "denetim_uyumu",  taban: 0.98, alt: 0.92, ust: 1.00 },
  { kod: "belirsizlik_istahi", taban: 0.17, alt: 0.05, ust: 0.45 },
];

function tekKosu(model, hizmetler, yapisal, ek4, senaryo, p, uretecFn, anahtar) {
  const r = uretecFn(anahtar);
  const s = merkezleriUret(Math.round(p.merkez_sayisi), hizmetler, yapisal, ek4, r,
    { yapisalUyum: p.yapisal_uyum, denetimUyum: p.denetim_uyumu });
  const z = model.uretCoklu(Math.round(p.ziyaretci), r);
  const e = eslestir(z, s.merkezler, hizmetler, senaryo, r,
    { belirsizlikIstahi: p.belirsizlik_istahi });
  return { uygun: e.oran.uygun, belirsiz: e.oran.belirsiz, doluluk: e.doluluk,
           red: s.red.length / (s.basvuru || 1) };
}

function duyarlilik(model, hizmetler, yapisal, ek4, senaryo, uretecFn,
                           { anahtar = 4242, tekrar = 3 } = {}) {
  const taban = {};
  PARAMETRELER.forEach(x => taban[x.kod] = x.taban);

  const ortalama = (p) => {
    const t = { uygun: 0, belirsiz: 0, doluluk: 0, red: 0 };
    for (let i = 0; i < tekrar; i++) {
      const k = tekKosu(model, hizmetler, yapisal, ek4, senaryo, p, uretecFn, anahtar + i * 131);
      for (const a in t) t[a] += k[a] / tekrar;
    }
    return t;
  };

  const temel = ortalama(taban);
  const satirlar = PARAMETRELER.map(x => {
    const alt = ortalama(Object.assign({}, taban, { [x.kod]: x.alt }));
    const ust = ortalama(Object.assign({}, taban, { [x.kod]: x.ust }));
    const etki = {};
    for (const a in temel) etki[a] = Math.abs(ust[a] - alt[a]);
    return { parametre: x.kod, alt: x.alt, ust: x.ust, altSonuc: alt, ustSonuc: ust, etki };
  });

  for (const olcut of ["uygun", "belirsiz", "doluluk", "red"]) {
    const enb = Math.max(...satirlar.map(s => s.etki[olcut])) || 1;
    satirlar.forEach(s => s.etki[olcut + "_norm"] = s.etki[olcut] / enb);
  }
  return { temel, satirlar };
}

/* Eşleştirme sonucu hesaplandıktan sonra adım adım gösterilir; sayılar
   birikirken hangi grubun büyüdüğü görülür. */
function zAnimasyon(){
  const kayitlar=ESLESME.kayitlar, n=kayitlar.length;
  const azalt=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#zSonuc").innerHTML='<div class="kart"><div class="yr">'+D.anim_b+'</div>'
    +'<div class="ilerle"><i id="animBar"></i></div>'
    +'<div class="serit" id="animSerit"><i style="width:0;background:var(--iyi)"></i>'
    +'<i style="width:0;background:var(--bel)"></i><i style="width:0;background:var(--kotu)"></i></div>'
    +'<p class="yr" id="animSay" style="margin:6px 0 0"></p></div>';
  if(azalt) return Promise.resolve();
  return new Promise(bitti=>{
    let i=0; const sy={uygun:0,belirsiz:0,uygun_degil:0};
    const parca=Math.max(40,Math.round(n/45));
    const bar=$("#animBar"), cub=$("#animSerit").children, say=$("#animSay");
    function adim(){
      const son=Math.min(n,i+parca);
      for(;i<son;i++) sy[kayitlar[i].durum]+=1;
      bar.style.width=(100*i/n).toFixed(1)+"%";
      cub[0].style.width=(100*sy.uygun/n).toFixed(2)+"%";
      cub[1].style.width=(100*sy.belirsiz/n).toFixed(2)+"%";
      cub[2].style.width=(100*sy.uygun_degil/n).toFixed(2)+"%";
      say.textContent=i+" / "+n+" "+D.anim_islenen;
      if(i<n) requestAnimationFrame(adim); else bitti();
    }
    requestAnimationFrame(adim);
  });
}

/* ---------- projeksiyon ---------- */
function grafik(yillar,s,yuzde,renk,dolgu){
  const W=340,H=132,L=36,R=8,T=8,B=22;
  let enb=0;(s.ust||s.ortanca).forEach(v=>{if(v>enb)enb=v});
  if(yuzde)enb=Math.max(enb,.6); enb=enb*1.12||1;
  const x=i=>L+(W-L-R)*(yillar.length<2?.5:i/(yillar.length-1)),y=v=>T+(H-T-B)*(1-v/enb);
  let g="";
  for(let i=0;i<=3;i++){const v=enb*i/3;
    g+='<line class="kilavuz" x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'"/>'
     +'<text class="eksen" x="'+(L-5)+'" y="'+(y(v)+3.2)+'" text-anchor="end">'
     +(yuzde?Math.round(v*100)+"%":(enb>12?Math.round(v):v.toFixed(1)))+'</text>';}
  yillar.forEach((yl,i)=>{if(yillar.length>6&&i%2)return;
    g+='<text class="eksen" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+yl+'</text>';});
  if(s.ust){let p="M"+x(0)+" "+y(s.ust[0]);
    s.ust.forEach((v,i)=>{if(i)p+=" L"+x(i)+" "+y(v)});
    for(let i=s.alt.length-1;i>=0;i--)p+=" L"+x(i)+" "+y(s.alt[i]);
    g+='<path d="'+p+'Z" fill="'+dolgu+'" opacity=".7"/>';}
  let p="M"+x(0)+" "+y(s.ortanca[0]);
  s.ortanca.forEach((v,i)=>{if(i)p+=" L"+x(i)+" "+y(v)});
  g+='<path d="'+p+'" fill="none" stroke="'+renk+'" stroke-width="2" stroke-linejoin="round"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}

  KAYIT=ORNEK.slice();
  formCiz(); egit();
  const sopt=s=>'<option value="'+s.kod+'">'+s.kod+" · "+(DIL==="en"?s.ad_en:s.ad)+'</option>';

  $("#pSen").innerHTML=SENLER.map(sopt).join("");
  projCiz(); rCiz(); belCiz(); senKutuCiz();
}
