<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esenlik senaryo simülasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--kagit:#EFF2F1;--panel:#FFF;--murekkep:#15181B;--soluk:#5C6568;--cizgi:#D4DAD9;--cizgi2:#A2ADAC;
 --iyi:#177A5C;--iyiA:#DBEDE5;--bel:#5B4DA6;--belA:#E4E1F3;--kotu:#A5382F;--kotuA:#F4DEDB;--vur:#B8641A;--vurA:#F7E6D4}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--kagit);color:var(--murekkep);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.sar{max-width:1080px;margin:0 auto;padding:0 20px 70px}
header{padding:40px 0 18px;position:relative}
.goz{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--soluk);margin:0 0 11px;padding-right:96px}
h1{font-weight:600;font-size:clamp(25px,4.2vw,40px);line-height:1.08;letter-spacing:-.02em;margin:0 0 11px}
h1 span{display:block}
.ozet{max-width:64ch;color:var(--soluk);margin:0}
button.dil{position:absolute;top:40px;right:0;background:none;border:1px solid var(--cizgi2);font-family:"IBM Plex Mono",monospace;font-size:11px;padding:6px 11px;cursor:pointer;color:inherit;border-radius:0}
h2{font-weight:600;font-size:20px;margin:0 0 5px}
h3{font-weight:600;font-size:14.5px;margin:0 0 8px}
p.bn{color:var(--soluk);font-size:13.5px;margin:0 0 16px;max-width:80ch}
.yol{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--cizgi2);border:1px solid var(--cizgi2);margin-bottom:26px}
.yol button{background:var(--panel);border:none;font:inherit;font-size:13px;padding:11px 8px;cursor:pointer;color:var(--soluk);border-radius:0;display:flex;align-items:center;justify-content:center;gap:7px}
.yol button b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:400}
.yol button[aria-current=true]{background:var(--murekkep);color:var(--kagit)}
.yol button:disabled{opacity:.42;cursor:default}
.adim{display:none}.adim.acik{display:block}
@media(max-width:600px){
 .yol{grid-template-columns:repeat(3,1fr)}
 .yol button{font-size:12.5px;padding:9px 6px}
 header{padding-top:34px}h1{font-size:26px}
}
.kart{background:var(--panel);border:1px solid var(--cizgi);padding:18px;margin-bottom:14px}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.uc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.drt{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kart.bel{border-color:var(--bel)}
@media(max-width:840px){.iki,.uc{grid-template-columns:1fr}
.drt{grid-template-columns:repeat(2,1fr)}}
button.gt{background:var(--murekkep);color:var(--kagit);border:none;font:inherit;font-weight:500;font-size:14px;padding:10px 16px;cursor:pointer;border-radius:0}
button.gt.ik{background:var(--panel);color:var(--murekkep);border:1px solid var(--cizgi2)}
button.gt:disabled{opacity:.4;cursor:default}
.dgm{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
label{font-size:12.5px;display:block;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--murekkep)}
select,input[type=number]{width:100%;font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--cizgi2);background:var(--kagit);color:inherit;border-radius:0}
.yr{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soluk)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid var(--cizgi);padding:5px 8px;text-align:left;vertical-align:middle}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--soluk);font-weight:400;background:var(--kagit)}
td.m,th.m{font-family:"IBM Plex Mono",monospace;font-size:11px}
.cb{position:relative;height:14px;background:var(--kagit);min-width:48px}
.cb i{position:absolute;left:0;top:0;height:100%;background:var(--cizgi2)}
.cb span{position:absolute;right:4px;top:0;font-family:"IBM Plex Mono",monospace;font-size:10px;line-height:14px}
.zayif{background:var(--vurA)}
.sayi{font-weight:600;font-size:26px;line-height:1.15}
.sayi small{display:block;font-size:12.5px;font-weight:400;color:var(--soluk);line-height:1.35;margin-top:2px}
.pil{font-size:11px;padding:2px 7px;background:var(--cizgi)}
.pil.iyi{background:var(--iyiA);color:var(--iyi)}.pil.kotu{background:var(--kotuA);color:var(--kotu)}
.pil.bel{background:var(--belA);color:var(--bel)}
.etk{display:flex;flex-wrap:wrap;gap:4px}.etk span{background:var(--kagit);border:1px solid var(--cizgi);font-size:11px;padding:1px 6px}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:1px;background:var(--cizgi);border:1px solid var(--cizgi)}
.mk button{background:var(--panel);border:none;font:inherit;color:inherit;text-align:left;padding:11px 12px;cursor:pointer;border-radius:0}
.mk button[aria-pressed=true]{background:var(--murekkep);color:var(--kagit)}
.mk .id{font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.65}
.mk .yy{font-size:12.5px;margin:4px 0 6px;line-height:1.3}
.dag rect{fill:var(--panel);stroke:var(--cizgi2);stroke-width:1;transition:fill .2s,stroke .2s}
.dag .akt rect{fill:var(--vurA);stroke:var(--vur);stroke-width:2}
.dag .bit rect{fill:var(--iyiA);stroke:var(--iyi)}
.dag .ad{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--soluk)}
.dag .dv{font-size:11px;fill:var(--murekkep);font-weight:500}
.kenar{stroke:var(--cizgi2);stroke-width:1;fill:none}
svg{display:block;width:100%;height:auto}
.serit{display:flex;height:26px;border:1px solid var(--cizgi);margin:6px 0 4px}
.serit i{display:block;height:100%}
.lej{display:flex;gap:14px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soluk)}
.lej i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.gk{background:var(--panel);padding:12px 14px 6px;border:1px solid var(--cizgi)}
.gk .gb{font-size:12.5px;font-weight:500;margin-bottom:2px}
.eksen{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--soluk)}
.kilavuz{stroke:var(--cizgi);stroke-width:1}
.ikili{display:inline-flex;gap:1px;background:var(--cizgi2);border:1px solid var(--cizgi2)}
.ikili button{background:var(--panel);border:none;font:inherit;font-size:12.5px;padding:5px 13px;cursor:pointer}
.ikili button[aria-pressed=true]{background:var(--murekkep);color:var(--kagit)}
.gez{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.dip{margin-top:30px;padding-top:15px;border-top:1px solid var(--cizgi2);font-size:12.5px;color:var(--soluk);max-width:82ch}
.dip p{margin:0 0 8px}
.kaydir{max-height:280px;overflow-y:auto;border:1px solid var(--cizgi)}
.bilgi{background:var(--kagit);border-left:3px solid var(--murekkep);padding:12px 14px;margin-top:12px}
.bilgi dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:12.5px}
.bilgi dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soluk)}
.bilgi dd{margin:0}
.ilerle{height:6px;background:var(--cizgi);margin:10px 0 4px}
.ilerle i{display:block;height:100%;background:var(--murekkep);width:0;transition:width .12s linear}
.serit i{transition:width .12s linear}
.rz{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;padding:2px 6px;background:var(--kagit);border:1px solid var(--cizgi)}
.ag1{background:var(--kotuA);color:var(--kotu)}.ag2{background:var(--vurA);color:var(--vur)}
.ag3{background:var(--cizgi)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sar">
<header>
  <button class="dil" id="dilb"></button>
  <p class="goz" data-i="goz"></p>
  <h1><span data-i="baslik"></span><span data-i="baslik2"></span></h1>
  <p class="ozet" data-i="ozet"></p>
</header>

<div class="yol" id="yol">
  <button data-a="1" aria-current="true"><b>01</b><span data-i="a1"></span></button>
  <button data-a="2"><b>02</b><span data-i="a2"></span></button>
  <button data-a="3"><b>03</b><span data-i="a3"></span></button>
  <button data-a="4"><b>04</b><span data-i="a4"></span></button>
  <button data-a="5"><b>05</b><span data-i="a5"></span></button>
</div>

<!-- 01 -->
<div class="adim acik" data-a="1">
  <h2 data-i="s1_b"></h2><p class="bn" data-i="s1_n"></p>
  <div class="iki">
    <div class="kart">
      <h3><span data-i="veri_b"></span> · <span id="kayitSayisi" class="yr"></span></h3>
      <p class="bn" style="font-size:12px" data-i="veri_ornek"></p>
      <div class="kaydir"><table><thead id="vbas"></thead><tbody id="vgovde"></tbody></table></div>
      <div class="dgm">
        <button class="gt ik" id="vSil" data-i="veri_sil"></button>
        <button class="gt ik" id="vSifirla" data-i="veri_sifirla"></button>
        <button class="gt ik" id="vBosalt" data-i="veri_bosalt"></button>
      </div>
      <h3 style="margin-top:20px" data-i="veri_ekle"></h3>
      <div id="vForm" class="uc" style="gap:10px"></div>
      <div class="dgm"><button class="gt" id="vEkle" data-i="veri_ekle"></button></div>
    </div>
    <div class="kart">
      <h3 data-i="dagilim_b"></h3>
      <div id="dagilim"></div>
    </div>
  </div>
  <div class="kart">
    <h3 data-i="model_b"></h3><p class="bn" data-i="model_n"></p>
    <div style="max-width:280px;margin-bottom:12px">
      <label data-i="model_dugum"></label><select id="dugumSec"></select>
    </div>
    <p class="yr" id="modelOzet" style="margin:0 0 8px"></p>
    <div class="kaydir"><table><thead id="kbas"></thead><tbody id="kgovde"></tbody></table></div>
  </div>
  <div class="kart">
    <h3 data-i="ornek_b"></h3><p class="bn" data-i="ornek_n"></p>
    <div class="iki">
      <div id="dag"></div>
      <div><table><tbody id="profil"></tbody></table></div>
    </div>
    <div class="dgm"><button class="gt ik" id="cek" data-i="ornek_dugme"></button></div>
  </div>
  <div class="gez"><span></span><button class="gt" data-git="2" data-i="ileri"></button></div>
</div>

<!-- 02 -->
<div class="adim" data-a="2">
  <h2 data-i="s2_b"></h2><p class="bn" data-i="s2_n"></p>
  <div class="kart">
    <div class="uc">
      <div><label data-i="m_adet"></label><input type="range" id="mAdet" min="20" max="160" step="10" value="60">
        <span class="yr" id="mAdet-d">60</span></div>
      <div><label data-i="m_yapisal"></label><input type="range" id="mYap" min="50" max="100" value="90">
        <span class="yr">%<span id="mYap-d">90</span></span></div>
      <div><label data-i="m_denetim"></label><input type="range" id="mDen" min="85" max="100" value="98">
        <span class="yr">%<span id="mDen-d">98</span></span></div>
    </div>
    <div class="dgm"><button class="gt" id="mUret" data-i="m_uret"></button></div>
  </div>
  <div id="mSonuc"></div>
  <div class="kart" id="malKart" style="display:none">
    <h3 data-i="mal_b"></h3><p class="bn" data-i="mal_n"></p>
    <div class="iki" style="margin-bottom:14px">
      <div><label data-i="mal_olcek"></label><input type="range" id="mOlcek" min="40" max="200" step="5" value="100">
        <span class="yr">×<span id="mOlcek-d">1.00</span></span></div>
      <div><label data-i="mal_doluluk"></label><input type="range" id="mDol" min="30" max="100" step="5" value="70">
        <span class="yr">%<span id="mDol-d">70</span></span></div>
    </div>
    <div id="malSonuc"></div>
  </div>
  <div class="gez"><button class="gt ik" data-git="1" data-i="geri"></button>
    <button class="gt" data-git="3" data-i="ileri"></button></div>
</div>

<!-- 03 -->
<div class="adim" data-a="3">
  <h2 data-i="s3_b"></h2><p class="bn" data-i="s3_n"></p>
  <div class="kart">
    <div class="uc">
      <div><label data-i="z_adet"></label><input type="range" id="zAdet" min="1000" max="12000" step="500" value="6000">
        <span class="yr" id="zAdet-d">6000</span></div>
      <div><label data-i="z_senaryo"></label><select id="zSen"></select></div>
      <div><label data-i="z_istah"></label><input type="range" id="zIst" min="0" max="60" value="17">
        <span class="yr">%<span id="zIst-d">17</span></span></div>
    </div>
    <div class="dgm"><button class="gt" id="zUret" data-i="z_uret"></button></div>
    <div class="bilgi" id="senKutu"></div>
    <p class="yr" id="zUyari" style="margin:10px 0 0"></p>
  </div>
  <div id="zSonuc"></div>
  <div class="gez"><button class="gt ik" data-git="2" data-i="geri"></button>
    <button class="gt" data-git="4" data-i="ileri"></button></div>
</div>

<!-- 04 -->
<div class="adim" data-a="4">
  <h2 data-i="s4_b"></h2><p class="bn" data-i="s4_n"></p>
  <div id="rSonuc"></div>
  <div class="kart" style="margin-top:20px">
    <h3 data-i="duy_b"></h3><p class="bn" data-i="duy_n"></p>
    <div class="dgm" style="margin-top:0"><button class="gt ik" id="duyCalistir" data-i="duy_calistir"></button></div>
    <div id="duySonuc" style="margin-top:14px"></div>
  </div>
  <div class="kart" style="margin-top:20px">
    <h3 data-i="proj_b"></h3><p class="bn" data-i="proj_n"></p>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <span class="yr" data-i="proj_ufuk"></span>
      <div class="ikili" id="ufuk"><button data-y="5" data-i="proj_5"></button>
        <button data-y="10" aria-pressed="true" data-i="proj_10"></button></div>
      <select id="pSen" style="max-width:240px"></select>
    </div>
    <div class="uc" id="proj" style="gap:1px"></div>
  </div>
  <div class="gez"><button class="gt ik" data-git="3" data-i="geri"></button><span></span></div>
</div>

<div class="adim" data-a="5">
  <h2 data-i="bel_b"></h2><p class="bn" data-i="bel_n"></p>
  <div class="uc" id="belOzet" style="margin-bottom:14px"></div>
  <div class="kart">
    <div style="max-width:320px;margin-bottom:12px">
      <label data-i="bel_suz"></label><select id="belSuz"></select>
    </div>
    <div id="belListe"></div>
  </div>
  <div class="gez"><button class="gt ik" data-git="4" data-i="geri"></button><span></span></div>
</div>

<div class="dip">
  <p><strong data-i="u1_b"></strong> <span data-i="u1"></span></p>
  <p><strong data-i="u2_b"></strong> <span data-i="u2"></span></p>
  <p><strong data-i="u3_b"></strong> <span data-i="u3"></span></p>
</div>
</div>

<script type="module">
import { Model, dagilim, uretec } from "./web/model.js";
import * as A from "./web/akis.js";
window.__mod = { Model, dagilim, uretec, A };
window.dispatchEvent(new Event("modul-hazir"));
</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let D={},DIL=localStorage.getItem("dil")==="en"?"en":"tr";
let YAPI,ORNEK,KAYIT=[],MODEL,HIZ,YAPISAL,EK4,SENLER,ONCEDEN,SZ;
let MERKEZLER=null,ESLESME=null,secM=null,seciliDugum="kronik_yuk",sonProfil=null;
let BELHARITA=null,MALIYET=null,DUYARLILIK=null;
const M=()=>window.__mod;

async function oku(y){
  if(window.GOMULU&&window.GOMULU[y]!==undefined)return window.GOMULU[y];
  const r=await fetch(y); if(!r.ok)throw new Error(y); return await r.text();
}
async function dilYukle(k){
  D=JSON.parse(await oku("diller/"+k+".json")); DIL=k;
  document.documentElement.lang=k; try{localStorage.setItem("dil",k)}catch(e){}
  $$("[data-i]").forEach(e=>e.textContent=D[e.dataset.i]||"");
  $("#dilb").textContent=D.diger;
}
const et=(o,v)=>D[o+"_"+v]||v;
const ALANLAR=["yas_grubu","kronik_yuk","risk_faktoru","yasam_tarzi","yakin_cerrahi","nekahet","ikamet","talep_arketipi"];

/* ---------- 01 veri ---------- */
function veriCiz(){
  $("#kayitSayisi").textContent=KAYIT.length+" "+D.veri_adet;
  $("#vbas").innerHTML="<tr>"+ALANLAR.map(a=>'<th>'+D["d_"+a]+'</th>').join("")+"</tr>";
  $("#vgovde").innerHTML=KAYIT.slice(-40).reverse().map(k=>
    "<tr>"+ALANLAR.map(a=>'<td>'+et(a,k[a])+'</td>').join("")+"</tr>").join("");
  $("#dagilim").innerHTML=ALANLAR.map(a=>{
    const d=M().dagilim(KAYIT,a,YAPI.dugumler[a].durumlar);
    return '<div style="margin-bottom:9px"><div class="yr">'+D["d_"+a]+'</div><table><tbody>'
      +d.map(x=>'<tr><td style="width:46%">'+et(a,x.durum)+'</td><td><div class="cb"><i style="width:'
      +(100*x.oran).toFixed(1)+'%"></i><span>'+x.adet+'</span></div></td></tr>').join("")
      +'</tbody></table></div>';}).join("");
}
function formCiz(){
  $("#vForm").innerHTML=ALANLAR.map(a=>'<div><label>'+D["d_"+a]+'</label><select data-f="'+a+'">'
    +YAPI.dugumler[a].durumlar.map(v=>'<option value="'+v+'">'+et(a,v)+'</option>').join("")
    +'</select></div>').join("");
}
function egit(){
  MODEL=new (M().Model)(YAPI,KAYIT,1);
  veriCiz(); dugumSecCiz(); kptCiz(); cek(false);
}
function dugumSecCiz(){
  $("#dugumSec").innerHTML=MODEL.sira.map(a=>'<option value="'+a+'"'
    +(a===seciliDugum?" selected":"")+'>'+D["d_"+a]+'</option>').join("");
}
function kptCiz(){
  const ad=seciliDugum,d=YAPI.dugumler[ad],eb=d.ebeveynler||[];
  const ks=MODEL.tumAnahtarlar(ad);
  const zayif=ks.filter(a=>MODEL.gozlem(ad,a)<5).length;
  $("#modelOzet").textContent=ks.length+" "+D.model_satir+(zayif?" · "+zayif+" "+D.model_zayif:"");
  $("#kbas").innerHTML="<tr><th>"+(eb.length?eb.map(e=>D["d_"+e]).join(", "):D.ebeveyn_yok)+"</th>"
    +d.durumlar.map(t=>'<th>'+et(ad,t)+'</th>').join("")+'<th class="m">'+D.gozlem+'</th></tr>';
  $("#kgovde").innerHTML=ks.map(a=>{
    const g=MODEL.gozlem(ad,a),r=MODEL.kpt[ad][a];
    return '<tr'+(g<5?' class="zayif"':'')+'><td class="m">'
      +(a==="*"?"—":a.split("|").map((x,i)=>et(eb[i],x)).join(", "))+'</td>'
      +r.map(p=>'<td><div class="cb"><i style="width:'+(100*p).toFixed(1)+'%"></i><span>'
        +p.toFixed(2)+'</span></div></td>').join("")+'<td class="m">'+g+'</td></tr>';}).join("");
}
const YER={yas_grubu:[110,10],ikamet:[400,10],yasam_tarzi:[10,80],kronik_yuk:[210,80],
 risk_faktoru:[10,150],yakin_cerrahi:[210,150],talep_arketipi:[400,150],nekahet:[210,220]};
const GN=160,YK=38;
function dagCiz(vurgu,deger){
  let kn="",kt="";
  for(const ad of MODEL.sira){const [x2,y2]=YER[ad];
    for(const e of (YAPI.dugumler[ad].ebeveynler||[])){const [x1,y1]=YER[e];
      const ax=x1+GN/2,ay=y1+YK,bx=x2+GN/2,by=y2,my=(ay+by)/2;
      kn+='<path class="kenar" d="M'+ax+' '+ay+' C'+ax+' '+my+' '+bx+' '+my+' '+bx+' '+by+'"/>';}}
  for(const ad of MODEL.sira){const [x,y]=YER[ad],v=deger&&deger[ad];
    kt+='<g class="'+(vurgu===ad?"akt":(v?"bit":""))+'"><rect x="'+x+'" y="'+y+'" width="'+GN+'" height="'+YK+'" rx="4"/>'

/* Eşleştirme sonucu hesaplandıktan sonra adım adım gösterilir; sayılar
   birikirken hangi grubun büyüdüğü görülür. */
function zAnimasyon(){
  const kayitlar=ESLESME.kayitlar, n=kayitlar.length;
  const azalt=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#zSonuc").innerHTML='<div class="kart"><div class="yr">'+D.anim_b+'</div>'
    +'<div class="ilerle"><i id="animBar"></i></div>'
    +'<div class="serit" id="animSerit"><i style="width:0;background:var(--iyi)"></i>'
    +'<i style="width:0;background:var(--bel)"></i><i style="width:0;background:var(--kotu)"></i></div>'
    +'<p class="yr" id="animSay" style="margin:6px 0 0"></p></div>';
  if(azalt) return Promise.resolve();
  return new Promise(bitti=>{
    let i=0; const sy={uygun:0,belirsiz:0,uygun_degil:0};
    const parca=Math.max(40,Math.round(n/45));
    const bar=$("#animBar"), cub=$("#animSerit").children, say=$("#animSay");
    function adim(){
      const son=Math.min(n,i+parca);
      for(;i<son;i++) sy[kayitlar[i].durum]+=1;
      bar.style.width=(100*i/n).toFixed(1)+"%";
      cub[0].style.width=(100*sy.uygun/n).toFixed(2)+"%";
      cub[1].style.width=(100*sy.belirsiz/n).toFixed(2)+"%";
      cub[2].style.width=(100*sy.uygun_degil/n).toFixed(2)+"%";
      say.textContent=i+" / "+n+" "+D.anim_islenen;
      if(i<n) requestAnimationFrame(adim); else bitti();
    }
    requestAnimationFrame(adim);
  });
}

/* ---------- projeksiyon ---------- */
function grafik(yillar,s,yuzde,renk,dolgu){
  const W=340,H=132,L=36,R=8,T=8,B=22;
  let enb=0;(s.ust||s.ortanca).forEach(v=>{if(v>enb)enb=v});
  if(yuzde)enb=Math.max(enb,.6); enb=enb*1.12||1;
  const x=i=>L+(W-L-R)*(yillar.length<2?.5:i/(yillar.length-1)),y=v=>T+(H-T-B)*(1-v/enb);
  let g="";
  for(let i=0;i<=3;i++){const v=enb*i/3;
    g+='<line class="kilavuz" x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'"/>'
     +'<text class="eksen" x="'+(L-5)+'" y="'+(y(v)+3.2)+'" text-anchor="end">'
     +(yuzde?Math.round(v*100)+"%":(enb>12?Math.round(v):v.toFixed(1)))+'</text>';}
  yillar.forEach((yl,i)=>{if(yillar.length>6&&i%2)return;
    g+='<text class="eksen" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+yl+'</text>';});
  if(s.ust){let p="M"+x(0)+" "+y(s.ust[0]);
    s.ust.forEach((v,i)=>{if(i)p+=" L"+x(i)+" "+y(v)});
    for(let i=s.alt.length-1;i>=0;i--)p+=" L"+x(i)+" "+y(s.alt[i]);
    g+='<path d="'+p+'Z" fill="'+dolgu+'" opacity=".7"/>';}
  let p="M"+x(0)+" "+y(s.ortanca[0]);
  s.ortanca.forEach((v,i)=>{if(i)p+=" L"+x(i)+" "+y(v)});
  g+='<path d="'+p+'" fill="none" stroke="'+renk+'" stroke-width="2" stroke-linejoin="round"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}

           [D.g_uyum,b.mevzuat.uyum_orani,1,"var(--iyi)","var(--iyiA)"],
           [D.g_doluluk,b.merkez.doluluk,1,"var(--bel)","var(--belA)"],
           [D.g_ucuncu,b.mevzuat.ucuncu_tespit,0,"var(--kotu)","var(--kotuA)"],
           [D.g_kayitdisi,b.mevzuat.kayit_disi,0,"var(--kotu)","var(--kotuA)"],
           [D.g_fiili,b.mevzuat.fiili_denetim_orani,1,"var(--vur)","var(--vurA)"]];
  $("#proj").innerHTML=g.map(([t,v,y,r,d])=>
    '<div class="gk"><div class="gb">'+t+'</div>'+grafik(Y,v,y,r,d)+'</div>').join("");
}

/* ---------- gezinme ---------- */
function git(a){
  $$(".adim").forEach(e=>e.classList.toggle("acik",e.dataset.a===String(a)));
  $$("#yol button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.a===String(a))));
  window.scrollTo({top:0,behavior:"instant"});
  if(a==="4"||a===4){rCiz();projCiz();}
}

async function baslat(){
  await dilYukle(DIL);
  YAPI=JSON.parse(await oku("mevzuat/ag_yapisi.json"));
  ORNEK=JSON.parse(await oku("veri/ornek_kayitlar.json")).kayitlar;
  HIZ=JSON.parse(await oku("mevzuat/hizmetler.json"));
  YAPISAL=JSON.parse(await oku("mevzuat/yapisal_kurallar.json"));
  EK4=JSON.parse(await oku("mevzuat/ek4_denetim.json"));
  SENLER=JSON.parse(await oku("mevzuat/senaryolar.json")).senaryolar;
  ONCEDEN=JSON.parse(await oku("cikti/onceden.json"));
  BELHARITA=JSON.parse(await oku("mevzuat/belirsizlik_haritasi.json"));
  MALIYET=JSON.parse(await oku("mevzuat/uyum_maliyeti.json"));
  const kod=k=>"S"+String(k.soru_no).padStart(2,"0");
  SZ={hizmet:{tr:Object.fromEntries(HIZ.hizmetler.map(h=>[h.kod,h.ad])),
              en:Object.fromEntries(HIZ.hizmetler.map(h=>[h.kod,h.ad_en||h.ad]))},
      yapisal:{tr:Object.fromEntries(YAPISAL.kurallar.map(k=>[k.dayanak,k.aciklama])),
               en:Object.fromEntries(YAPISAL.kurallar.map(k=>[k.dayanak,k.aciklama_en||""]))},
      soru:{tr:Object.fromEntries(EK4.kurallar.map(k=>[k.dayanak,k.soru])),
            en:Object.fromEntries(EK4.kurallar.map(k=>[k.dayanak,k.soru_en||""]))}};
  KAYIT=ORNEK.slice();
  formCiz(); egit();
  const sopt=s=>'<option value="'+s.kod+'">'+s.kod+" · "+(DIL==="en"?s.ad_en:s.ad)+'</option>';
  $("#zSen").innerHTML=SENLER.map(sopt).join("");
  $("#pSen").innerHTML=SENLER.map(sopt).join("");
  projCiz(); rCiz(); belCiz(); senKutuCiz();
}

$$("#yol button").forEach(b=>b.addEventListener("click",()=>git(b.dataset.a)));
$$("[data-git]").forEach(b=>b.addEventListener("click",()=>git(b.dataset.git)));
$("#cek").addEventListener("click",()=>cek(true));
$("#dugumSec").addEventListener("change",e=>{seciliDugum=e.target.value;kptCiz();});
$("#vEkle").addEventListener("click",()=>{
  const k={};$$("#vForm select").forEach(s=>k[s.dataset.f]=s.value);KAYIT.push(k);egit();});
$("#vSil").addEventListener("click",()=>{KAYIT.pop();egit();});
$("#vSifirla").addEventListener("click",()=>{KAYIT=ORNEK.slice();egit();});
$("#vBosalt").addEventListener("click",()=>{KAYIT=[];egit();});
$("#mUret").addEventListener("click",merkezUret);
$("#zUret").addEventListener("click",zUret);
$("#pSen").addEventListener("change",projCiz);
$("#zSen").addEventListener("change",senKutuCiz);
$("#belSuz").addEventListener("change",belCiz);
$("#duyCalistir").addEventListener("click",duyHesapla);
["mOlcek","mDol"].forEach(a=>$("#"+a).addEventListener("input",()=>{
  $("#"+a+"-d").textContent=a==="mOlcek"?(+$("#mOlcek").value/100).toFixed(2):$("#mDol").value;
  malCiz();}));
$$("#ufuk button").forEach(b=>b.addEventListener("click",()=>{
  $$("#ufuk button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));projCiz();}));
[["mAdet","mAdet-d"],["mYap","mYap-d"],["mDen","mDen-d"],["zAdet","zAdet-d"],["zIst","zIst-d"]]
  .forEach(([a,b])=>$("#"+a).addEventListener("input",()=>$("#"+b).textContent=$("#"+a).value));
$("#dilb").addEventListener("click",async()=>{
  await dilYukle(DIL==="tr"?"en":"tr");
  formCiz();veriCiz();dugumSecCiz();kptCiz();dagCiz(null,sonProfil);
  if(sonProfil)cek(false);
  const sopt=s=>'<option value="'+s.kod+'">'+s.kod+" · "+(DIL==="en"?s.ad_en:s.ad)+'</option>';
  const z=$("#zSen").value,p=$("#pSen").value;
  $("#zSen").innerHTML=SENLER.map(sopt).join("");$("#zSen").value=z;
  $("#pSen").innerHTML=SENLER.map(sopt).join("");$("#pSen").value=p;
  if(MERKEZLER){merkezCiz();malCiz();} zCiz(); rCiz(); projCiz();
  $("#belSuz").innerHTML=""; belCiz(); senKutuCiz(); duyCiz();});

const basla=()=>baslat().catch(e=>{document.body.insertAdjacentHTML("afterbegin",
  '<p style="padding:12px;color:#A5382F">Hata: '+e.message+'</p>');});
if(window.__mod) basla(); else window.addEventListener("modul-hazir",basla);
</script>
